<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Calar · Inventario</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3ed;color:#25382b;font:17px system-ui}main{max-width:600px;margin:auto;padding:18px}header{background:#294b36;color:white;padding:22px;border-radius:18px}h1{margin:0;font-size:28px}small{display:block}section{background:white;border-radius:16px;padding:18px;margin:14px 0}label{display:block;font-weight:650;margin:14px 0 5px}input,select,textarea,button{font:inherit;width:100%;padding:13px;border:1px solid #c8cec4;border-radius:10px;background:white;color:inherit}button{background:#294b36;color:white;border:0;margin-top:10px;cursor:pointer;min-height:48px}button.secondary{background:#e7ece4;color:#294b36} .row{display:flex;gap:12px}.row>*{flex:1;min-width:0} .check{display:flex;align-items:center;gap:10px}.check input{width:24px;height:24px}#code{font-size:30px;font-weight:bold;text-align:center;margin:15px}#status{font-size:14px;min-height:22px}img{max-width:100%;max-height:220px}article{border-top:1px solid #ddd;padding:12px 0} </style></head><body><main><noscript>Activa JavaScript en Safari para guardar las fichas.</noscript><header><small>FINCA GÉRGAL · AULAGO</small><h1>El Calar</h1>Inventario y cuaderno de campo · V1.2</header><section id="stats"></section><section><div class="row"><div><label for="b">Bancal</label><select id="b"><option value="1">Bancal 1</option><option value="2">Bancal 2</option><option value="3">Bancal 3</option><option value="4">Bancal 4</option><option value="5">Bancal 5</option><option value="6">Bancal 6</option><option value="7">Bancal 7</option><option value="8">Bancal 8</option><option value="9">Bancal 9</option><option value="10">Bancal 10</option><option value="11">Bancal 11</option><option value="12">Bancal 12</option><option value="13">Bancal 13</option><option value="14">Bancal 14</option><option value="15">Bancal 15</option><option value="16">Bancal 16</option><option value="17">Bancal 17</option><option value="18">Bancal 18</option></select></div><div><label for="n">Árbol nº</label><input id="n" type="number" min="1" step="1" value="1"></div></div><div id="code">Árbol 1/1</div><div id="lastWorks"></div><form id="form"><div id="fields"><label for="species">Especie</label><select id="species"><option>Olivo</option><option>Almendro</option><option>Higuera</option><option>Granado</option><option>Níspero</option><option>Otro</option></select><label for="variety">Variedad</label><select id="variety"><option>Desconocida</option><option>Picual</option><option>Arbequina</option><option>Otra</option></select><label for="age">Edad</label><select id="age"><option>Sin evaluar</option><option>Joven</option><option>Media</option><option>Viejo</option></select><label for="health">Salud</label><select id="health"><option>Sin evaluar</option><option>Sano</option><option>Regular</option><option>Débil</option><option>Crítico</option><option>Muerto</option></select><label for="leaf">Follaje</label><select id="leaf"><option>Sin evaluar</option><option>Abundante</option><option>Normal</option><option>Escaso</option><option>Sin hojas</option></select><label for="vigor">Vigor</label><select id="vigor"><option>Sin evaluar</option><option>Alto</option><option>Medio</option><option>Bajo</option></select><label for="production">Producción habitual</label><select id="production"><option>Sin evaluar</option><option>En producción</option><option>Baja producción</option><option>Sin producción</option></select><label for="disease">Síntomas</label><select id="disease"><option>Sin evaluar</option><option>Ninguno visible</option><option>Repilo</option><option>Barrenillo</option><option>Sospecha de verticilosis</option><option>Otros</option></select><label for="pruning">Poda</label><select id="pruning"><option>Sin evaluar</option><option>No necesita</option><option>Ligera</option><option>Recuperación</option></select></div><label class="check"><input type="checkbox" id="priority"> Prioritario 2027</label><label for="notes">Observaciones</label><textarea id="notes" rows="3"></textarea><label>Fotografía (opcional)</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" hidden><button type="button" class="secondary" id="gps">Registrar GPS</button><small id="coords"></small><button type="submit">Guardar ficha y siguiente árbol</button><div id="status" role="status"></div></form></section><section id="workSection"><h2>Registrar trabajo agrícola</h2><form id="workForm"><label>Fecha</label><input id="workDate" type="date" required><label>Tipo de trabajo</label><select id="workType"><option>Abonado foliar</option><option>Abonado al suelo</option><option>Fertirriego</option><option>Tratamiento con cobre</option><option>Tratamiento fitosanitario</option><option>Riego</option><option>Poda</option><option>Otros</option></select><label>Producto</label><input id="workProduct" placeholder="Nombre del producto"><label>Dosis / cantidad</label><input id="workDose" placeholder="Ej. 500 g / 100 L"><label>Alcance</label><select id="workScope"><option value="banks">Bancales completos</option><option value="all">Toda la finca</option><option value="individual">Árboles individuales</option><option value="priority">Olivos prioritarios registrados</option></select><div id="workTargets"></div><label>Observaciones</label><textarea id="workNotes" rows="2"></textarea><button>Guardar trabajo</button></form><h3>Historial de trabajos</h3><div id="workList"></div><button id="workCSV" class="secondary">Exportar trabajos CSV</button></section><section><h2>Árboles registrados</h2><div id="list"></div></section><section><h2>Copias y exportación</h2><button id="csv">Exportar inventario CSV (Excel)</button><button id="backup" class="secondary">Copia completa JSON (incluye fotos)</button><label>Restaurar copia JSON</label><input id="restore" type="file" accept=".json,application/json"><small>Los datos se guardan en este navegador si admite almacenamiento local. Exporta una copia al terminar cada jornada.</small></section></main><script>
const $=id=>document.getElementById(id), key='elcalar-inventario-v1';let records={},pic='',loc=null;try{records=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};const fields={species:['Especie','Olivo','Almendro','Higuera','Granado','Níspero','Otro'],variety:['Variedad','Desconocida','Picual','Arbequina','Otra'],age:['Edad','Sin evaluar','Joven','Media','Viejo'],health:['Salud','Sin evaluar','Sano','Regular','Débil','Crítico','Muerto'],leaf:['Follaje','Sin evaluar','Abundante','Normal','Escaso','Sin hojas'],vigor:['Vigor','Sin evaluar','Alto','Medio','Bajo'],production:['Producción habitual','Sin evaluar','En producción','Baja producción','Sin producción'],disease:['Síntomas','Sin evaluar','Ninguno visible','Repilo','Barrenillo','Sospecha de verticilosis','Otros'],pruning:['Poda','Sin evaluar','No necesita','Ligera','Recuperación']};const code=()=>$('b').value+'/'+$('n').value;function load(){let r=records[code()]?.at(-1);$('code').textContent='Árbol '+code();for(const id in fields)$(id).value=r?.[id]||fields[id][1];$('priority').checked=!!r?.priority;$('notes').value=r?.notes||'';pic=r?.photo||'';loc=r?.gps||null;$('photo').value='';showPhoto();$('coords').textContent=loc?`${loc.lat.toFixed(6)}, ${loc.lon.toFixed(6)} · ±${Math.round(loc.accuracy)} m`:''}function showPhoto(){$('preview').hidden=!pic;if(pic)$('preview').src=pic}function render(){let keys=Object.keys(records);$('stats').textContent=keys.length+' árboles registrados · '+keys.filter(k=>records[k].at(-1).species==='Olivo'&&records[k].at(-1).priority).length+' / 100 olivos prioritarios';$('list').replaceChildren();keys.filter(k=>k.split('/')[0]===$('b').value).sort((a,b)=>Number(a.split('/')[1])-Number(b.split('/')[1])).forEach(k=>{let r=records[k].at(-1),a=document.createElement('article');a.textContent=k+' · '+r.species+' · '+r.health+' · '+records[k].length+' revisión(es)';let btn=document.createElement('button');btn.className='secondary';btn.textContent='Abrir '+k;btn.onclick=()=>{$('n').value=k.split('/')[1];load();$('code').scrollIntoView()};a.append(btn);$('list').append(a)})}function persist(next){try{localStorage.setItem(key,JSON.stringify(next));records=next;return true}catch(e){alert('No se ha podido guardar en el navegador. Exporta una copia o libera espacio.');return false}}$('b').onchange=()=>{$('n').value=1;load();render()};$('n').onchange=load;$('photo').onchange=()=>{let f=$('photo').files[0];if(!f)return;let img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,800/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);pic=c.toDataURL('image/jpeg',.65);URL.revokeObjectURL(u);showPhoto()};img.onerror=()=>alert('No se pudo leer la foto');img.src=u};$('gps').onclick=()=>{if(!navigator.geolocation)return alert('GPS no disponible');navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};$('coords').textContent=`${loc.lat.toFixed(6)}, ${loc.lon.toFixed(6)} · ±${Math.round(loc.accuracy)} m`},()=>alert('GPS no disponible o permiso denegado'),{enableHighAccuracy:true,timeout:15000})};$('form').onsubmit=e=>{e.preventDefault();let k=code(),r={code:k,date:new Date().toISOString(),priority:$('priority').checked,notes:$('notes').value,photo:pic,gps:loc};for(let id in fields)r[id]=$(id).value;let next={...records,[k]:[...(records[k]||[]),r]};if(persist(next)){$('status').textContent='Guardado: '+k;$('n').value=Number($('n').value)+1;load();render()}};function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('backup').onclick=()=>download('elcalar-copia.json',JSON.stringify(records),'application/json');$('csv').onclick=()=>{let cols=['code','date',...Object.keys(fields),'priority','notes','lat','lon','accuracy'];let esc=v=>'"'+String(v??'').replaceAll('"','""')+'"';let rows=Object.values(records).flat().map(r=>cols.map(k=>esc(r[k]??r.gps?.[k])).join(';'));download('elcalar-inventario.csv','\ufeff'+cols.join(';')+'\n'+rows.join('\n'),'text/csv')};$('restore').onchange=async()=>{try{let r=JSON.parse(await $('restore').files[0].text());if(!r||Array.isArray(r)||Object.entries(r).some(([k,v])=>!/^\d+\/\d+$/.test(k)||!Array.isArray(v)||!v.length||v.some(x=>!x||x.code!==k)))throw Error();if(confirm('¿Reemplazar inventario actual por esta copia?')){if(persist(r)){load();render()}}}catch(e){alert('Copia no válida')}};load();render();</script><script>
const workKey='elcalar-trabajos-v1';let works=[];try{works=JSON.parse(localStorage.getItem(workKey)||'[]');if(!Array.isArray(works))works=[]}catch(e){};
const types=['Abonado foliar','Abonado al suelo','Fertirriego','Tratamiento con cobre','Tratamiento fitosanitario','Riego','Poda','Otros'];
function saveWorks(next){try{localStorage.setItem(workKey,JSON.stringify(next));works=next;return true}catch(e){alert('No se pudo guardar el trabajo.');return false}}
function matches(w,k){return w.scope==='all'||(w.scope==='banks'?w.targets.includes(k.split('/')[0]):w.targets.includes(k))}
function dateText(d){return d.split('-').reverse().join('/')}
function line(parent,t){let p=document.createElement('p');p.textContent=t;parent.append(p)}
function treeWorks(){let el=$('lastWorks');el.replaceChildren();let h=document.createElement('h3');h.textContent='Últimos trabajos · '+code();el.append(h);let list=works.filter(w=>matches(w,code())).sort((a,b)=>b.date.localeCompare(a.date));let groups=[['Último abonado',['Abonado foliar','Abonado al suelo','Fertirriego']],['Último tratamiento',['Tratamiento con cobre','Tratamiento fitosanitario']],...types.map(t=>['Último: '+t,[t]])];for(let [label,ts] of groups){let w=list.find(x=>ts.includes(x.type));line(el,label+': '+(w?dateText(w.date)+(w.product?' · '+w.product:''):'Sin registro'))}let details=document.createElement('details'),sum=document.createElement('summary');sum.textContent='Historial completo ('+list.length+')';details.append(sum);for(let w of list)line(details,dateText(w.date)+' · '+w.type+' · '+[w.product,w.dose,w.notes].filter(Boolean).join(' · '));el.append(details)}
function targets(){let el=$('workTargets');el.replaceChildren();let scope=$('workScope').value;if(scope==='all'){line(el,'Se aplicará a todos los árboles, incluidos los que inventaríes después.');return}if(scope==='priority'){line(el,'Se guardarán los códigos de los olivos prioritarios actuales.');return}let vals=scope==='banks'?Array.from({length:18},(_,i)=>String(i+1)):Object.keys(records).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(!vals.length)line(el,'Registra primero los árboles individuales.');for(let v of vals){let l=document.createElement('label');l.className='check';let c=document.createElement('input');c.type='checkbox';c.value=v;l.append(c,document.createTextNode(scope==='banks'?'Bancal '+v:v));el.append(l)}if(scope==='banks')line(el,'Incluye los árboles que inventaríes después en estos bancales; usa selección individual si no trataste todos.')}
function showWorks(){let el=$('workList');el.replaceChildren();for(let w of [...works].sort((a,b)=>b.date.localeCompare(a.date))){let a=document.createElement('article');line(a,dateText(w.date)+' · '+w.type);line(a,[w.product,w.dose,w.scope==='all'?'Toda la finca':w.targets.join(', '),w.notes].filter(Boolean).join(' · '));let b=document.createElement('button');b.type='button';b.className='secondary';b.textContent='Eliminar registro';b.onclick=()=>{if(confirm('¿Eliminar este trabajo del historial de todos los árboles afectados?')&&saveWorks(works.filter(x=>x.id!==w.id))){showWorks();treeWorks()}};a.append(b);el.append(a)}if(!works.length)line(el,'Todavía no hay trabajos registrados.');treeWorks()}
let today=new Date();$('workDate').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');$('workScope').onchange=targets;$('workForm').onsubmit=e=>{e.preventDefault();let scope=$('workScope').value,ts=scope==='priority'?Object.keys(records).filter(k=>records[k].at(-1).species==='Olivo'&&records[k].at(-1).priority):Array.from($('workTargets').querySelectorAll('input:checked'),x=>x.value);if(scope!=='all'&&!ts.length)return alert('Selecciona al menos un bancal o árbol.');let w={id:Date.now()+'-'+Math.random(),date:$('workDate').value,type:$('workType').value,product:$('workProduct').value,dose:$('workDose').value,notes:$('workNotes').value,scope,targets:ts};if(saveWorks([...works,w])){showWorks();alert('Trabajo guardado');$('workNotes').value=''}};
const originalLoad=load;load=function(){originalLoad();treeWorks()};const originalRender=render;render=function(){originalRender();if($('workScope').value==='individual')targets()};
$('workCSV').onclick=()=>{let cols=['date','type','product','dose','scope','targets','notes'];let esc=v=>'"'+String(v??'').replaceAll('"','""')+'"';download('elcalar-trabajos.csv','\ufeff'+cols.join(';')+'\n'+works.map(w=>cols.map(k=>esc(w[k])).join(';')).join('\n'),'text/csv')};
$('backup').onclick=()=>download('elcalar-copia.json',JSON.stringify({version:2,records,works}),'application/json');$('restore').onchange=async()=>{try{let data=JSON.parse(await $('restore').files[0].text()),r=data.version===2?data.records:data,w=data.version===2?data.works:[];if(!r||Array.isArray(r)||Object.entries(r).some(([k,v])=>!/^\d+\/\d+$/.test(k)||!Array.isArray(v)||!v.length||v.some(x=>!x||x.code!==k))||!Array.isArray(w)||w.some(x=>!x||typeof x.date!=='string'||!types.includes(x.type)||!['all','banks','individual','priority'].includes(x.scope)||!Array.isArray(x.targets)))throw Error();if(confirm('¿Reemplazar inventario y trabajos por esta copia?')){let old=records;if(persist(r)){if(!saveWorks(w)){persist(old);return}load();render();showWorks()}}}catch(e){alert('Copia no válida')}};targets();showWorks();
</script></body></html>
